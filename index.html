<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>委託資訊與需求表</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --surface-alt: #f1efe9;
      --text: #1f1e1c;
      --muted: #68655e;
      --border: #e2dfd7;
      --accent: #003c64;
      --accent-hover: #002b48;
      --accent-soft: #e3eff7;
      --ok: #003c64;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .block {
      margin-top: 18px;
    }

    .block-title {
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .opt-card {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: var(--bg);
      cursor: pointer;
      transition: 0.15s ease;
      user-select: none;
    }

    .opt-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .opt-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .opt-price {
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 4px;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
    }

    .notice {
      margin-top: 14px;
      font-size: 0.83rem;
      color: var(--muted);
    }

    section[aria-label="委託摘要"] {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
    }

    .summary-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--ok);
    }

    .summary-head.error {
      color: #b42318;
    }

    pre {
      margin: 0;
      padding: 10px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      font-size: 0.88rem;
    }

    a.mail-btn {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }

    a.mail-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>委託資訊與需求表</h1>
        <p>可直接勾選多個想委託的項目，填寫後會寄送至指定信箱並產生摘要。</p>
      </div>
      <div class="status-pill">
        <span class="status-dot" aria-hidden="true"></span>
        <span>目前開放委託</span>
      </div>
    </header>

    <form id="commissionForm">
      <div class="block">
        <div class="block-title">委託項目（可複選）</div>
        <div id="itemsGrid" class="options-grid"></div>
      </div>

      <div class="two-col">
        <div>
          <label for="nameInput">稱呼 / 社群聯絡方式 *</label>
          <input id="nameInput" type="text" required placeholder="例如：小明（@xxx）" />
        </div>
        <div>
          <label for="emailInput">你的回信 Email *</label>
          <input id="emailInput" type="email" required placeholder="例如：client@example.com" />
        </div>
      </div>

      <div class="two-col">
        <div>
          <label for="deadlineInput">期望交期</label>
          <input id="deadlineInput" type="text" placeholder="例如：2026/12 中旬前" />
        </div>
        <div>
          <label for="budgetInput">預算範圍</label>
          <input id="budgetInput" type="text" placeholder="例如：NT$ 1,500 - 3,000 或可議" />
        </div>
      </div>

      <div>
        <label for="detailInput">需求說明 *</label>
        <textarea id="detailInput" required placeholder="請簡述需求內容、風格或參考方向..."></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="submitBtn">送出委託並寄信</button>
        <button type="reset" class="btn-secondary">清空</button>
      </div>
    </form>

    <p class="notice">送出後會直接寄送至你的 Email，下方也會同步顯示委託摘要方便複製或手動寄送。</p>

    <section aria-label="委託摘要" id="summarySection" hidden>
      <div class="summary-head" id="summaryHead">
        <span role="status" id="statusMessage">已產生委託摘要（可複製貼給接案者）</span>
        <button type="button" class="btn-secondary" id="copySummaryBtn">複製摘要</button>
      </div>
      <pre id="summaryOutput"></pre>
      <a id="mailtoAction" class="mail-btn" href="mailto:">開啟預設信箱寄出此需求 →</a>
    </section>
  </main>

  <script>
    const ITEMS = [
      { id: "item-1", title: "基礎委託項目", price: "NT$ 1,000 起" },
      { id: "item-2", title: "進階委託項目", price: "NT$ 2,500 起" },
      { id: "item-3", title: "客製 / 組合委託", price: "依需求報價" }
    ];

    // ★ 請填入你用來收委託通知的 Gmail
    const RECEIVER_EMAIL = "tkpc1999@gmail.com";

    const selected = new Set();
    const itemsGrid = document.getElementById("itemsGrid");

    ITEMS.forEach((item) => {
      const card = document.createElement("div");
      card.className = "opt-card";
      card.innerHTML = `
        <div class="opt-top">
          <span>${item.title}</span>
          <input type="checkbox" aria-label="${item.title}" />
        </div>
        <div class="opt-price">${item.price}</div>
      `;
      const cb = card.querySelector("input");
      card.addEventListener("click", (e) => {
        if (e.target !== cb) cb.checked = !cb.checked;
        if (cb.checked) {
          selected.add(item.id);
          card.classList.add("active");
        } else {
          selected.delete(item.id);
          card.classList.remove("active");
        }
      });
      itemsGrid.appendChild(card);
    });

    const form = document.getElementById("commissionForm");
    const submitBtn = document.getElementById("submitBtn");
    const summarySection = document.getElementById("summarySection");
    const summaryHead = document.getElementById("summaryHead");
    const summaryOutput = document.getElementById("summaryOutput");
    const statusMessage = document.getElementById("statusMessage");
    const mailtoAction = document.getElementById("mailtoAction");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const picked = ITEMS.filter((i) => selected.has(i.id)).map((i) => `・${i.title}（${i.price}）`);
      const name = document.getElementById("nameInput").value.trim();
      const replyEmail = document.getElementById("emailInput").value.trim();
      const deadline = document.getElementById("deadlineInput").value.trim() || "未填寫";
      const budget = document.getElementById("budgetInput").value.trim() || "未填寫";
      const detail = document.getElementById("detailInput").value.trim();

      const result = [
        "【委託需求單】",
        `聯絡人／方式：${name}`,
        `回信 Email：${replyEmail}`,
        `勾選項目：${picked.length ? "\n" + picked.join("\n") : "未勾選"}`,
        `期望交期：${deadline}`,
        `預算範圍：${budget}`,
        `需求說明：\n${detail}`
      ].join("\n");

      summaryOutput.textContent = result;
      summarySection.hidden = false;

      const subject = encodeURIComponent(`委託洽詢 - ${name}`);
      const body = encodeURIComponent(result);
      mailtoAction.href = `mailto:${encodeURIComponent(RECEIVER_EMAIL)}?subject=${subject}&body=${body}`;

      submitBtn.disabled = true;
      submitBtn.textContent = "寄送中...";

      try {
        const res = await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(RECEIVER_EMAIL)}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            _subject: `【委託洽詢】${name}`,
            _replyto: replyEmail,
            聯絡人與方式: name,
            回信Email: replyEmail,
            勾選項目: picked.length ? picked.join(" / ") : "未
